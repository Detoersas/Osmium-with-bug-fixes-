<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network access</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#111827;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#1e3a5f,#111827 55%)}main{width:min(620px,100%);padding:32px;border:1px solid #334155;border-radius:20px;background:#172033;box-shadow:0 20px 60px #0005}h1{margin-top:0}p{color:#cbd5e1;line-height:1.6}label{display:block;margin:22px 0 8px;font-weight:700}input{width:100%;padding:13px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:#fff;font-size:1rem}button{margin-top:14px;padding:13px 18px;border:0;border-radius:10px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer}#error{color:#fda4af;min-height:1.4em}.note{font-size:.9rem;color:#94a3b8}
  </style>
</head>
<body>
<main>
  <h1>Network access</h1>
  <p>Enter the access code supplied by the network owner to continue to the DNS setup page.</p>
  <form id="gate">
    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" required>
    <button type="submit">Continue</button>
  </form>
  <p id="error" role="alert"></p>
  <p class="note">This page does not authorize internet access by itself; the router or WISP must provide the guest-network access.</p>
</main>
<script>
document.querySelector('#gate').addEventListener('submit', function(event){event.preventDefault();var value=document.querySelector('#code').value.trim().toLowerCase();if(value==='unlocked'){location.href='/howtounlock/guide.html';}else{document.querySelector('#error').textContent='That access code is not correct.';}});
</script>
</body>
</html>
